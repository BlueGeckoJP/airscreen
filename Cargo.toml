[package]
name = "airscreen"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
color-eyre = "0.6"
crossbeam-channel = "0.5"
eframe = { version = "0.33", features = ["wgpu"] }
image = "0.25"
openh264 = "0.9"
quinn = "0.11"
rayon = "1.11"
rcgen = "0.14"
rustls = "0.23"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
turbojpeg = { version = "1.3", features = ["image"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.12"
pipewire = "0.9"

[target.'cfg(windows)'.dependencies]
windows-capture = "1.5.0"
